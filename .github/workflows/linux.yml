name: Linux

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            coverage: false
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            coverage: true
            gcov_executable: gcov-14
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            coverage: true
            gcov_executable: "llvm-cov-18 gcov"

    runs-on: ubuntu-24.04
    name: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        if: matrix.coverage
        run: pip install gcovr

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
              -DNUCLEUS_BUILD_TESTS=ON \
              -DNUCLEUS_BUILD_EXAMPLES=OFF \
              -DNUCLEUS_BUILD_SOURCE_XML=ON \
              -DNUCLEUS_COVERAGE=ON
          else
            cmake . -B build -DCMAKE_BUILD_TYPE=Release \
              -DNUCLEUS_BUILD_TESTS=ON \
              -DNUCLEUS_BUILD_EXAMPLES=ON \
              -DNUCLEUS_BUILD_SOURCE_XML=ON
          fi

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      # NUCLEUS_COVERAGE scopes instrumentation to first-party targets, so the
      # fetched dependencies emit no gcov data; the exclude below is
      # belt-and-braces against any future directory-global flag.
      - name: Generate coverage
        if: matrix.coverage
        run: |
          gcovr build \
            --root . \
            --gcov-executable "${{ matrix.gcov_executable }}" \
            --filter 'include/nucleus/' \
            --filter 'src/nucleus/' \
            --gcov-exclude-directories '.*/_deps/.*' \
            --xml coverage.xml

      - name: Upload to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure (AddressSanitizer)
        run: >-
          cmake . -B build-asan
          -DNUCLEUS_BUILD_TESTS=ON
          -DNUCLEUS_BUILD_SANITIZER=ON

      - name: Build
        run: cmake --build build-asan

      - name: Test
        run: cd build-asan && ctest --output-on-failure

  core-purity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Core-purity check
        run: bash scripts/core_purity_check.sh

  install-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and install
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DNUCLEUS_BUILD_TESTS=OFF \
            -DNUCLEUS_BUILD_EXAMPLES=OFF \
            -DNUCLEUS_BUILD_SOURCE_XML=OFF
          cmake --build build
          cmake --install build

      - name: Build consumer
        run: |
          cmake tests/integration -B build-consumer \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer

      - name: Run consumer test
        run: ./build-consumer/integration_test
