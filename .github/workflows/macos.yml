name: macOS

on:
  push:
    branches:
      - master
      - develop
      - milestone/**
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

# One run per branch per workflow: a push to develop and an open develop->master
# PR share a concurrency group (head_ref for PRs, ref_name for pushes), so the
# newer run supersedes the older instead of burning a duplicate job.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Each leg asserts the diagnostic backend its configure step selected, so a runner
  # image that changes Apple's libc++ cannot silently move a leg off its path.
  # libc++ hides std::format below a macOS 13.3 deployment target, which keeps the
  # {fmt} fallback covered on images whose default target would ship std::format.
  # macos-26-intel is the last x86_64 image; the Intel legs end when it retires.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, xcode: "16.2", deployment-target: "13.0", std-format: "0" }
          - { runner: macos-26, xcode: "26.6", deployment-target: "", std-format: "1" }
          - { runner: macos-26-intel, xcode: "26.6", deployment-target: "", std-format: "1" }
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      # macOS ships bash 3.2, below the 5.0 the generated completion script needs,
      # and the bash smoke tests drive whichever bash is first on PATH.
      - name: Install a supported bash
        run: |
          brew install bash
          bash -c 'echo "$BASH_VERSION"; ((BASH_VERSINFO[0] >= 5))'

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment-target }} \
            -DNUCLEUS_BUILD_TESTS=ON \
            -DNUCLEUS_BUILD_EXAMPLES=ON \
            -DNUCLEUS_BUILD_SOURCE_XML=ON

      - name: Check the format backend
        run: grep -x '#define NUCLEUS_USE_STD_FORMAT ${{ matrix.std-format }}' build/lib/generated/nucleus/detail/format_backend.h

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure --timeout 300

  install-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, deployment-target: "13.0", std-format: "0" }
          - { runner: macos-26-intel, deployment-target: "", std-format: "1" }
    runs-on: ${{ matrix.runner }}
    name: install-test (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v4

      # On the fallback leg {fmt} enters the exported link interface. A discoverable
      # system fmt lets the build resolve it via find_package and, crucially, lets the
      # installed package's find_dependency(fmt) resolve for the downstream consumer below.
      - name: Install fmt
        run: brew install fmt

      - name: Build and install
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment-target }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DNUCLEUS_BUILD_TESTS=OFF \
            -DNUCLEUS_BUILD_EXAMPLES=OFF \
            -DNUCLEUS_BUILD_SOURCE_XML=OFF
          cmake --build build
          cmake --install build

      - name: Check the format backend
        run: grep -x '#define NUCLEUS_USE_STD_FORMAT ${{ matrix.std-format }}' build/lib/generated/nucleus/detail/format_backend.h

      - name: Build consumer
        run: |
          cmake tests/consumer_surface/integration -B build-consumer \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment-target }} \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer

      - name: Run consumer test
        run: ./build-consumer/integration_test

  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    name: sanitizer (address, ${{ matrix.runner }})
    # Apple's runtime has no LeakSanitizer, so LSan false-positives on macOS.
    # Disabling leak detection keeps the address checks (use-after-free, overflow)
    # while opting out of the unsupported leak leg -- the standard macOS knob.
    # abort_on_error defaults to 1 on Darwin (0 on Linux): on a finding ASan would
    # raise SIGABRT, which CTest reports as "Subprocess aborted" and does not let
    # PASS_REGULAR_EXPRESSION override -- so the asan_trip_test assertion fails. Exit
    # instead of aborting so the trip test's expected diagnostic is matched, exactly
    # as on Linux; a real finding still terminates its test with a non-zero exit.
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=0
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2, below the 5.0 the generated completion script needs,
      # and the bash smoke tests drive whichever bash is first on PATH.
      - name: Install a supported bash
        run: |
          brew install bash
          bash -c 'echo "$BASH_VERSION"; ((BASH_VERSINFO[0] >= 5))'

      - name: Configure
        run: >-
          cmake . -B build-san
          -DNUCLEUS_BUILD_TESTS=ON
          -DNUCLEUS_BUILD_SOURCE_XML=ON
          -DNUCLEUS_BUILD_SANITIZER=ON
          -DNUCLEUS_SANITIZER=address

      - name: Build
        run: cmake --build build-san

      - name: Test
        run: cd build-san && ctest --output-on-failure --timeout 300
