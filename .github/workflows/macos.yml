name: macOS

on:
  push:
    branches:
      - develop
      - milestone/**
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
      - ".gitignore"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
      - ".gitignore"
  workflow_dispatch:

# One run per branch per workflow: a push to develop and an open develop->master
# PR share a concurrency group (head_ref for PRs, ref_name for pushes), so the
# newer run supersedes the older instead of burning a duplicate job.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        xcode: ["15.4", "16.2"]
    runs-on: macos-14
    name: build (Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DNUCLEUS_BUILD_TESTS=ON \
            -DNUCLEUS_BUILD_EXAMPLES=ON \
            -DNUCLEUS_BUILD_SOURCE_XML=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  install-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Apple's libc++ lacks std::format on these runners, so the diagnostic
      # seam falls back to {fmt} and it enters the exported link interface. A
      # discoverable system fmt lets the build resolve it via find_package and,
      # crucially, lets the installed package's find_dependency(fmt) resolve for
      # the downstream consumer below.
      - name: Install fmt
        run: brew install fmt

      - name: Build and install
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DNUCLEUS_BUILD_TESTS=OFF \
            -DNUCLEUS_BUILD_EXAMPLES=OFF \
            -DNUCLEUS_BUILD_SOURCE_XML=OFF
          cmake --build build
          cmake --install build

      - name: Build consumer
        run: |
          cmake tests/integration -B build-consumer \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer

      - name: Run consumer test
        run: ./build-consumer/integration_test
