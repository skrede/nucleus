name: macOS

on:
  push:
    branches:
      - master
      - develop
      - milestone/**
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

# One run per branch per workflow: a push to develop and an open develop->master
# PR share a concurrency group (head_ref for PRs, ref_name for pushes), so the
# newer run supersedes the older instead of burning a duplicate job.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        xcode: ["15.4", "16.2"]
    runs-on: macos-14
    name: build (Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      # Report whether this runner's libc++ ships std::format. When it does not,
      # the diagnostic seam falls back to {fmt} and its header enters the maxed
      # warning surface -- so the answer records which code path the -Werror gate
      # actually covers here. Informational only; never fails the job.
      - name: Probe std::format availability
        run: |
          printf '#include <version>\n#ifdef __cpp_lib_format\n#error FORMAT_PRESENT\n#endif\nint main(){}\n' > fmtprobe.cpp
          if clang++ -std=c++20 -fsyntax-only fmtprobe.cpp 2>&1 | grep -q FORMAT_PRESENT; then
            echo "__cpp_lib_format defined: std::format present, {fmt} fallback INACTIVE"
          else
            echo "__cpp_lib_format undefined: std::format absent, {fmt} fallback ACTIVE"
          fi

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DNUCLEUS_BUILD_TESTS=ON \
            -DNUCLEUS_BUILD_EXAMPLES=ON \
            -DNUCLEUS_BUILD_SOURCE_XML=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure --timeout 300

  install-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Apple's libc++ lacks std::format on these runners, so the diagnostic
      # seam falls back to {fmt} and it enters the exported link interface. A
      # discoverable system fmt lets the build resolve it via find_package and,
      # crucially, lets the installed package's find_dependency(fmt) resolve for
      # the downstream consumer below.
      - name: Install fmt
        run: brew install fmt

      - name: Build and install
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DNUCLEUS_BUILD_TESTS=OFF \
            -DNUCLEUS_BUILD_EXAMPLES=OFF \
            -DNUCLEUS_BUILD_SOURCE_XML=OFF
          cmake --build build
          cmake --install build

      - name: Build consumer
        run: |
          cmake tests/consumer_surface/integration -B build-consumer \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer

      - name: Run consumer test
        run: ./build-consumer/integration_test

  sanitizer:
    runs-on: macos-14
    name: sanitizer (address)
    # Apple's runtime has no LeakSanitizer, so LSan false-positives on macOS.
    # Disabling leak detection keeps the address checks (use-after-free, overflow)
    # while opting out of the unsupported leak leg -- the standard macOS knob.
    # abort_on_error defaults to 1 on Darwin (0 on Linux): on a finding ASan would
    # raise SIGABRT, which CTest reports as "Subprocess aborted" and does not let
    # PASS_REGULAR_EXPRESSION override -- so the asan_trip_test assertion fails. Exit
    # instead of aborting so the trip test's expected diagnostic is matched, exactly
    # as on Linux; a real finding still terminates its test with a non-zero exit.
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=0
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake . -B build-san
          -DNUCLEUS_BUILD_TESTS=ON
          -DNUCLEUS_BUILD_SOURCE_XML=ON
          -DNUCLEUS_BUILD_SANITIZER=ON
          -DNUCLEUS_SANITIZER=address

      - name: Build
        run: cmake --build build-san

      - name: Test
        run: cd build-san && ctest --output-on-failure --timeout 300
