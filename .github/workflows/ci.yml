name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            GENERATOR_OPTIONS="-A x64"
          fi

          cmake . -B build -DCMAKE_BUILD_TYPE=Release $GENERATOR_OPTIONS \
            -DNUCLEUS_BUILD_TESTS=ON \
            -DNUCLEUS_BUILD_EXAMPLES=ON \
            -DNUCLEUS_BUILD_SOURCE_XML=ON \
            -DNUCLEUS_BUILD_TOKENIZER_HOST=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure (AddressSanitizer)
        run: >-
          cmake -B build-asan
          -DNUCLEUS_BUILD_TESTS=ON
          -DNUCLEUS_BUILD_SANITIZER=ON

      - name: Build (AddressSanitizer)
        run: cmake --build build-asan

      - name: Test under AddressSanitizer
        run: ctest --test-dir build-asan --output-on-failure

  core-purity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Core-purity check
        run: bash scripts/core_purity_check.sh

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr

      - name: Configure (coverage)
        run: >-
          cmake -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DNUCLEUS_BUILD_TESTS=ON
          -DNUCLEUS_COVERAGE=ON

      - name: Build (coverage)
        run: cmake --build build-coverage

      - name: Test (coverage)
        run: ctest --test-dir build-coverage --output-on-failure

      # The coverage flags are directory-global, so the FetchContent'd test
      # dependencies are instrumented too; their sources are not resolvable
      # relative to --root, which newer gcovr treats as a hard error. Skip
      # their raw coverage files outright -- only nucleus' own coverage is
      # wanted (the report filters already restrict to include/ and src/).
      - name: Generate report
        run: >-
          gcovr --root .
          --filter 'include/nucleus/' --filter 'src/nucleus/'
          --gcov-exclude-directories '.*/_deps/.*'
          --xml-pretty --output coverage.xml
          build-coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          slug: skrede/nucleus
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
