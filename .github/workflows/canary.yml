name: Canary

on:
  push:
    branches:
      - develop
      - milestone/**
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary-gcc:
    runs-on: ubuntu-24.04
    container: gcc:latest
    # Advisory drift detection against the newest packaged GCC -- never a merge gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # gcc:latest is a bare Debian image; neither cmake nor git ship by default.
      - name: Install cmake
        run: apt-get update && apt-get install -y cmake

      - name: Configure
        run: cmake . -B build -DNUCLEUS_BUILD_TESTS=ON -DNUCLEUS_BUILD_EXAMPLES=ON -DNUCLEUS_BUILD_SOURCE_XML=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure --timeout 300

  canary-clang:
    runs-on: ubuntu-24.04
    # Advisory drift detection against the current LLVM stable release -- never a
    # merge gate. No version pinned deliberately.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install latest clang (apt.llvm.org)
        # llvm.sh installs only versioned binaries (clang-NN, no bare clang
        # symlink), and a bare CC=clang silently falls back to the runner's
        # distro clang -- so resolve the newest installed version explicitly.
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh
          LLVM_VER=$(ls /usr/bin/clang-* | grep -oE '[0-9]+$' | sort -n | tail -1)
          echo "CC=clang-${LLVM_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_VER}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake . -B build -DNUCLEUS_BUILD_TESTS=ON -DNUCLEUS_BUILD_EXAMPLES=ON -DNUCLEUS_BUILD_SOURCE_XML=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure --timeout 300
