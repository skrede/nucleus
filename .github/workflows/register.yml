name: Register

# Every gate here reads a markdown file: the exception register, the README or
# the release notes. The '**.md' ignore every build workflow carries would skip
# precisely the edit that can turn these gates red: a register row added, a
# ledger count that no longer matches the tree, a README call or pin changed, a
# release heading renamed. So this workflow carries no path filter of any kind.
# The build workflows keep theirs, because none of their jobs reads a markdown
# file -- a workflow's triggers are derived from what its own jobs read, and the
# divergence here is deliberate. Do not align this block with the sibling
# workflows. A pushed release tag runs it too, and on that run a README tag pin
# passes only if the remote has published the tag.
#
# The size-ceiling gate below measures the whole tree rather than the units one
# change touched, and that is what takes the pull request out of the equation.
# The shape it replaces asked git for a common ancestor with the target branch,
# had none to find on a push to a working branch, and exited zero having
# measured nothing -- a green in the run summary that nothing had earned.
#
# What measuring the whole tree does NOT claim: it does not establish that every
# unit is the right size. It establishes only that each unit is inside its
# ceiling, or inside the figure the register records for it -- and that figure is
# a decision a human made, not a fact the gate found.
on:
  push:
    branches:
      - master
      - develop
      - milestone/**
    tags: ['v*']
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

# This workflow reads the repository and writes nothing back to it, so say so
# structurally rather than leaving it to the discipline of whoever edits next.
permissions:
  contents: read

# One run per branch per workflow: a push to develop and an open develop->master
# PR share a concurrency group (head_ref for PRs, ref_name for pushes), so the
# newer run supersedes the older instead of burning a duplicate job.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  size-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install measurement tools
        run: sudo apt-get update && sudo apt-get install -y universal-ctags jq

      # Exuberant Ctags installs under the same command name and accepts no JSON
      # output format, so every function would measure 0 and the gate would pass
      # without having measured anything. Here that has to be loud, unlike the
      # local hook, which warns and lets the commit through.
      - name: Assert the ctags flavor
        run: |
          if ! ctags --version | head -n 1 | grep -q 'Universal Ctags'; then
            ctags --version | head -n 1 >&2
            echo "universal-ctags is required to measure function spans" >&2
            exit 1
          fi

      # A gate only ever run against a tree that passes cannot tell you it still
      # fails. This unit is built to be refused -- one line over the ceiling and
      # absent from the register -- so a widened exclusion, a dropped extension
      # or a register lookup that has started matching everything shows up as a
      # red step here rather than as a whole-tree green that measured nothing.
      # It is written under a build directory name because the listing in the
      # step below must not reach it.
      - name: Assert the gate still refuses
        run: |
          mkdir -p build-size-control
          awk 'BEGIN { for (i = 0; i < 201; i++) print "int over_ceiling_control();" }' > build-size-control/over_ceiling.cpp
          if cmake -DNUCLEUS_SIZE_FILES=build-size-control/over_ceiling.cpp \
              -P tests/cmake/check_local_size_growth.cmake; then
            echo "the gate accepted a unit over the ceiling carrying no register row" >&2
            exit 1
          fi
          rm -rf build-size-control

      # The listing is every unit the register could possibly speak about, and it
      # is not a changed-file listing: a unit someone else left over the ceiling
      # is refused on this commit rather than on theirs. The listing decides what
      # is looked at; EXCEPTIONS.md decides what an over-ceiling unit is held to.
      # Neither role substitutes for the other.
      - name: Size-ceiling gate
        run: |
          files=$(git ls-files |
            grep -E '\.(h|hpp|cpp|cc|cmake)$|(^|/)CMakeLists\.txt$' |
            paste -sd';')
          cmake -DNUCLEUS_SIZE_FILES="$files" \
            -P tests/cmake/check_local_size_growth.cmake

  example-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gate tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-18 universal-ctags jq

      # Exuberant Ctags installs under the same command name and accepts no JSON
      # output format, so every function would measure 0 and the size gate inside
      # the checker would pass without having measured anything.
      - name: Assert the ctags flavor
        run: |
          if ! ctags --version | head -n 1 | grep -q 'Universal Ctags'; then
            ctags --version | head -n 1 >&2
            echo "universal-ctags is required to measure function spans" >&2
            exit 1
          fi

      # The size-gate job above proves its gate still refuses; this one had no
      # equivalent. Four controls, because four different edits can turn the
      # format step into a green that measured nothing: the check must reject a
      # misformatted unit, must refuse an empty file list rather than report
      # success having read nothing, must treat a wrong formatter version as
      # fatal on a CI run carrying no flags at all, and must still stay advisory
      # off CI so a contributor on another distribution keeps the other twelve
      # steps. The third is the one that matters most -- it is what makes this
      # job's verdict independent of any -D a later edit might drop from the step
      # below. The controls live under a build directory name so the gate's own
      # whole-tree listings cannot reach them.
      - name: Assert the format gate still refuses
        run: |
          mkdir -p build-format-control
          printf 'int  main( ){return 0;}\n' > build-format-control/bad.cpp
          cat > build-format-control/refuses.cmake <<'CONTROL'
          include(tests/cmake/pinned_formatter.cmake)
          resolve_pinned_formatter(exe declined)
          set(files build-format-control/bad.cpp)
          run_format_check("${exe}" files)
          CONTROL
          if cmake -DNUCLEUS_GATE_AUTHORITATIVE=ON -P build-format-control/refuses.cmake; then
            echo "the format gate accepted a misformatted unit" >&2
            exit 1
          fi
          cat > build-format-control/empty.cmake <<'CONTROL'
          include(tests/cmake/pinned_formatter.cmake)
          resolve_pinned_formatter(exe declined)
          set(files)
          run_format_check("${exe}" files)
          CONTROL
          if cmake -DNUCLEUS_GATE_AUTHORITATIVE=ON -P build-format-control/empty.cmake; then
            echo "the format gate reported success having been given no files" >&2
            exit 1
          fi
          cat > build-format-control/pin.cmake <<'CONTROL'
          include(tests/cmake/pinned_formatter.cmake)
          set(nucleus_format_major 99)
          resolve_pinned_formatter(exe declined)
          CONTROL
          if cmake -P build-format-control/pin.cmake; then
            echo "a wrong formatter version was tolerated on a CI run carrying no flags" >&2
            exit 1
          fi
          if ! env -u CI cmake -P build-format-control/pin.cmake; then
            echo "the advisory path outside CI became fatal; contributors are now blocked" >&2
            exit 1
          fi
          rm -rf build-format-control

      # Its own job rather than a CTest entry: the checker runs the complete CTest
      # suite itself, so registering it there would recurse.
      - name: Example contract gate
        run: |
          cmake -DNUCLEUS_SOURCE_DIR=. \
            -DNUCLEUS_BUILD_DIR=build-example-contracts \
            -DNUCLEUS_CONFIG=Debug \
            -DNUCLEUS_GATE_AUTHORITATIVE=ON \
            -P tests/cmake/check_example_contracts.cmake

  # The README's consumer call and vendoring pin, and the release notes' version,
  # are read by no build, and this is the workflow a markdown-only commit still
  # triggers.
  readme-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: README and release-notes gate
        run: |
          cmake -DNUCLEUS_README=README.md \
            -DNUCLEUS_CHANGELOG=CHANGELOG.md \
            -DNUCLEUS_PROJECT_FILE=CMakeLists.txt \
            -DNUCLEUS_CONSUMER_FILE=tests/consumer_surface/integration/CMakeLists.txt \
            -P tests/cmake/check_readme_claims.cmake

      # A gate only ever run against a tree that passes cannot show that it still
      # fails. The doctored copies live under a build directory name so the size
      # gate's listing cannot reach them.
      - name: Assert the README gate still refuses
        run: |
          c=build-readme-control
          mkdir -p "$c"
          readme_gate() {
            cmake -DNUCLEUS_README=README.md \
              -DNUCLEUS_CHANGELOG=CHANGELOG.md \
              -DNUCLEUS_PROJECT_FILE=CMakeLists.txt \
              -DNUCLEUS_CONSUMER_FILE=tests/consumer_surface/integration/CMakeLists.txt \
              "$@" -P tests/cmake/check_readme_claims.cmake > "$c/gate.log" 2>&1
          }
          doctor() {
            local source=$1 copy=$2
            shift 2
            sed "$@" "$source" > "$copy"
            if cmp -s "$source" "$copy"; then
              echo "$copy is identical to $source, so its control would test nothing" >&2
              exit 1
            fi
          }
          refuses() {
            local what=$1 fragment=$2
            shift 2
            if readme_gate "$@"; then
              echo "the README gate accepted $what" >&2
              exit 1
            fi
            if ! tr -s ' \n' ' ' < "$c/gate.log" | grep -qF "$fragment"; then
              cat "$c/gate.log" >&2
              echo "the README gate refused $what for a reason other than the one it exists to report" >&2
              exit 1
            fi
          }
          doctor README.md "$c/no-xml.md" 's/OPTIONAL_COMPONENTS xml)/)/'
          refuses "a find_package call that lost a component" \
            "find_package call differs from the one the integration consumer configures" \
            -DNUCLEUS_README="$c/no-xml.md"
          doctor README.md "$c/two-calls.md" '$a find_package(nucleus 0.4 REQUIRED CONFIG)'
          refuses "a README with two find_package calls" \
            "expected exactly one find_package(nucleus ...) call, found 2" \
            -DNUCLEUS_README="$c/two-calls.md"
          doctor CHANGELOG.md "$c/heading.md" '0,/^## /s/^## .*/## 0.0.0/'
          refuses "release notes opening on another version" \
            "the first release heading names 0.0.0, but the project declares" \
            -DNUCLEUS_CHANGELOG="$c/heading.md"
          doctor README.md "$c/foreign-tag.md" -E 's/GIT_TAG [^ )]+/GIT_TAG v0.0.0/'
          refuses "a vendoring pin naming another release" \
            "the vendoring pin names v0.0.0, but the project declares" \
            -DNUCLEUS_README="$c/foreign-tag.md"
          doctor README.md "$c/quoted-tag.md" -E 's/GIT_TAG [^ )]+/GIT_TAG "v0.0.0"/'
          refuses "a quoted vendoring pin naming another release" \
            "the vendoring pin names v0.0.0, but the project declares" \
            -DNUCLEUS_README="$c/quoted-tag.md"
          doctor README.md "$c/comment-paren.md" '/^FetchContent_Declare(nucleus$/a\    # a comment (with a parenthesis)'
          if ! readme_gate -DNUCLEUS_README="$c/comment-paren.md"; then
            cat "$c/gate.log" >&2
            echo "the README gate refused a vendoring block whose comment carries a parenthesis, so it reads the comment as the block's end" >&2
            exit 1
          fi
          version=$(sed -nE 's/^project\(nucleus VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          sed -E "s/GIT_TAG [^ )]+/GIT_TAG v$version/" README.md > "$c/own-tag.md"
          if [ -z "$version" ] || ! grep -qF "GIT_TAG v$version)" "$c/own-tag.md"; then
            echo "the own-tag copy does not pin v$version, so the control below would test another pin" >&2
            exit 1
          fi
          if ! readme_gate -DNUCLEUS_README="$c/own-tag.md"; then
            cat "$c/gate.log" >&2
            echo "the README gate refused a pin naming the release this tree declares, so the refusals above may refuse every release tag" >&2
            exit 1
          fi
          rm -rf build-readme-control

      - name: README pin gate
        run: |
          require=OFF
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            require=ON
          fi
          cmake -DNUCLEUS_README=README.md \
            -DNUCLEUS_PROJECT_FILE=CMakeLists.txt \
            -DNUCLEUS_PIN_DIR=build-readme-pin \
            -DNUCLEUS_PIN_REQUIRE_PUBLISHED=$require \
            -P tests/cmake/check_readme_pin.cmake

      # Every control's output goes to a file, so the pending control's notice
      # does not render as an annotation on every run. The published arm is
      # controlled against a local remote because the real one may carry no tag.
      - name: Assert the pin gate still refuses
        run: |
          c=build-pin-control
          mkdir -p "$c"
          pin_gate() {
            cmake -DNUCLEUS_README=README.md \
              -DNUCLEUS_PROJECT_FILE=CMakeLists.txt \
              -DNUCLEUS_PIN_DIR="$c/clone" \
              -DNUCLEUS_PIN_REQUIRE_PUBLISHED=OFF \
              "$@" -P tests/cmake/check_readme_pin.cmake > "$c/gate.log" 2>&1
          }
          doctor() {
            local source=$1 copy=$2
            shift 2
            sed "$@" "$source" > "$copy"
            if cmp -s "$source" "$copy"; then
              echo "$copy is identical to $source, so its control would test nothing" >&2
              exit 1
            fi
          }
          refuses() {
            local what=$1 fragment=$2
            shift 2
            if pin_gate "$@"; then
              echo "the pin gate accepted $what" >&2
              exit 1
            fi
            if ! tr -s ' \n' ' ' < "$c/gate.log" | grep -qF "$fragment"; then
              cat "$c/gate.log" >&2
              echo "the pin gate refused $what for a reason other than the one it exists to report" >&2
              exit 1
            fi
          }
          doctor README.md "$c/unknown-sha.md" -E 's/GIT_TAG [^ )]+/GIT_TAG 0123456789abcdef0123456789abcdef01234567/'
          refuses "a commit no published ref contains" \
            "which no branch or tag published at" \
            -DNUCLEUS_README="$c/unknown-sha.md"
          doctor README.md "$c/foreign-tag.md" -E 's/GIT_TAG [^ )]+/GIT_TAG v0.0.0/'
          refuses "an unpublished tag naming another release" \
            "has not published and which is not the release this tree declares" \
            -DNUCLEUS_README="$c/foreign-tag.md"
          doctor README.md "$c/branch.md" -E 's/GIT_TAG [^ )]+/GIT_TAG master/'
          refuses "a branch name" \
            "neither a full commit SHA nor a release tag" \
            -DNUCLEUS_README="$c/branch.md"
          git init --quiet --bare "$c/remote.git"
          tree=$(git -C "$c/remote.git" mktree < /dev/null)
          commit=$(git -C "$c/remote.git" -c user.name=control -c user.email=control@invalid \
            commit-tree --no-gpg-sign -m control "$tree")
          git -C "$c/remote.git" update-ref refs/tags/v77.0.0 "$commit"
          remote="file://$PWD/$c/remote.git"
          doctor CMakeLists.txt "$c/CMakeLists-77.txt" -E 's/^project\(nucleus VERSION [0-9.]+/project(nucleus VERSION 77.0.0/'
          doctor README.md "$c/published.md" -E -e "s|GIT_REPOSITORY [^ )]+|GIT_REPOSITORY $remote|" \
            -e 's/GIT_TAG [^ )]+/GIT_TAG v77.0.0/'
          if ! pin_gate -DNUCLEUS_README="$c/published.md" -DNUCLEUS_PROJECT_FILE="$c/CMakeLists-77.txt" \
              -DNUCLEUS_PIN_REQUIRE_PUBLISHED=ON ||
              ! grep -qF "readme pin: v77.0.0 is published at $remote" "$c/gate.log"; then
            cat "$c/gate.log" >&2
            echo "the pin gate did not find a release tag the remote has published, so its published arm may never pass" >&2
            exit 1
          fi
          doctor CMakeLists.txt "$c/CMakeLists.txt" -E 's/^project\(nucleus VERSION [0-9.]+/project(nucleus VERSION 99.0.0/'
          doctor README.md "$c/unpublished.md" -E -e "s|GIT_REPOSITORY [^ )]+|GIT_REPOSITORY $remote|" \
            -e 's/GIT_TAG [^ )]+/GIT_TAG v99.0.0/'
          refuses "a pending own release tag on a release-tag run" \
            "has not published it, and a release-tag run passes only a published tag" \
            -DNUCLEUS_README="$c/unpublished.md" -DNUCLEUS_PROJECT_FILE="$c/CMakeLists.txt" \
            -DNUCLEUS_PIN_REQUIRE_PUBLISHED=ON
          if ! pin_gate -DNUCLEUS_README="$c/unpublished.md" -DNUCLEUS_PROJECT_FILE="$c/CMakeLists.txt" ||
              ! grep -q '^::notice title=README pin::pending release tag v99\.0\.0' "$c/gate.log"; then
            cat "$c/gate.log" >&2
            echo "the pin gate did not pass a pending own release tag with its notice" >&2
            exit 1
          fi
          rm -rf build-pin-control
